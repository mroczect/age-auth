[package]
name = "libage_otp"
version = "0.1.0"
edition = "2024"
description = "OTP (TOTP/HOTP) generator, independent of age, for the age-auth library"
license = "MIT"
repository = "https://github.com/mroczect/age-auth"
readme = "README.md"

[dependencies]
libage_auth_handler = { path = "../libage_auth_handler" }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
base32 = "0.5.1"
hex = "0.4.3"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "otp_benchmark"
harness = false