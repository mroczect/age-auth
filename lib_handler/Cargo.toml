[package]
name = "lib_handler"
version = "0.1.0"
edition = "2024"
description = "Core traits, error types, and handlers for the age-auth workspace"
license = "MIT"
repository = "https://github.com/mroczect/age-auth"
readme = "README.md"

[dependencies]
base32 = "0.5.1"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
